name: Build Distinct Luxury Walkthrough V5
on:
  push:
    branches: [remodeling-v2-hostinger-test]
    paths:
      - .github/workflows/build-distinct-walkthrough-v5.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remodeling-v2-hostinger-test
      - name: Download distinct Pexels luxury room video and export versioned frames
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p video-sync-test/assets/v5/frames
          curl -fL --retry 3 --retry-delay 3 --connect-timeout 15 --max-time 160 'https://videos.pexels.com/video-files/11630727/11630727-uhd_2560_1440_25fps.mp4' -o /tmp/new-v5.mp4
          test "$(stat -c%s /tmp/new-v5.mp4)" -gt 500000
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          DURATION=$(ffprobe -v error -show_entries format=duration -of csv=p=0 /tmp/new-v5.mp4)
          echo "Video length: $DURATION"
          FPS=$(awk -v d="$DURATION" 'BEGIN {printf "%.5f", 120/d}')
          echo "Frame sampling rate: $FPS"
          ffmpeg -hide_banner -loglevel error -y -i /tmp/new-v5.mp4 -an -vf 'scale=960:-2,fps=24' -c:v libx264 -pix_fmt yuv420p -preset veryfast -crf 27 -movflags +faststart video-sync-test/assets/v5/walkthrough.mp4
          ffmpeg -hide_banner -loglevel error -y -ss 0.4 -i /tmp/new-v5.mp4 -frames:v 1 -vf scale=960:-2 video-sync-test/assets/v5/poster.jpg
          ffmpeg -hide_banner -loglevel error -y -i /tmp/new-v5.mp4 -vf "fps=$FPS,scale=1024:-2" -frames:v 120 -c:v libwebp -quality 75 -compression_level 4 video-sync-test/assets/v5/frames/frame_%03d.webp
          ffmpeg -hide_banner -loglevel error -y -i /tmp/new-v5.mp4 -vf "fps=4/$DURATION,scale=480:-2,tile=4x1" -frames:v 1 -q:v 3 video-sync-test/assets/v5/preview.jpg
          COUNT=$(find video-sync-test/assets/v5/frames -type f -name 'frame_*.webp' | wc -l)
          echo "Exported $COUNT frames"
          test "$COUNT" -ge 115
          ls -lh video-sync-test/assets/v5
          du -sh video-sync-test/assets/v5/*
      - name: Publish frames to same demo branch safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add video-sync-test/assets/v5/
          git diff --staged --quiet && exit 0
          git commit -m 'Publish versioned luxury interior v5 120-frame animation'
          git fetch origin remodeling-v2-hostinger-test
          git rebase origin/remodeling-v2-hostinger-test
          git push origin HEAD:remodeling-v2-hostinger-test
